name: Update Silsilah Otomatis

on:
  push:
    paths:
      - 'data/approved.json'
  workflow_dispatch:

jobs:
  generate-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate tree.js dari approved data
        run: python scripts/generate_tree.py

      - name: Commit dan push tree.js baru
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add tree.js data/approved.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update silsilah [$(date '+%Y-%m-%d %H:%M')]"
            git push origin HEAD:main
          fi
